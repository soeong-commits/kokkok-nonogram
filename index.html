<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#C5D23A">
<title>콕콕 노노그램</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@800;900&display=swap">
<style>
/* 색은 레퍼런스(캐주얼 게임 맵) 화면에서 뽑았어요: 풀밭 #C5D23A/#B4CA3B, 길 #FEDF84, 나무 #52A231, 버튼 틀 #CD8727 */
:root{
  --grass:#C5D23A; --grass2:#B4CA3B; --leaf:#52A231;
  --path:#FEDF84; --path-e:#F2C664;
  --wood:#CD8727; --cream:#FFF5EA; --cream2:#FBE3C2;
  /* 스트로크는 한 색으로 통일하지 않고, 요소마다 자기 면 색을 한 단계 짙게 한 색을 써요 */
  --or-s:#C2600E; --green-s:#3B8A1A; --cream-s:#D9AE7A; --white-s:#D8C2A2; --wood-s:#8A4E10; --frame-s:#A8692A;
  --pink-s:#C42A5C; --red-s:#B83220; --grass-s:#6C8A12; --sky-s:#5AAFC2; --clue-s:#E2BC85;
  --tx:#5A3214; --sub:#9A6A3C; --or:#FF9E3B; --or-d:#E2741F; --green:#6CC63A; --green-d:#4A9E23;
  --pink:#FF5184; --red:#FF5943; --sky:#47D1DE; --yel:#FFD23A;
  --cellbg:#FBF5E4; --gl:#FFFFFF; --gb:#FFFFFF; --x:#D9BE95; --clue:#FFEBC9; --clue-hl:#FFD27A; --coral:#FF5A5F;
  --kr:"Jua",-apple-system,"Apple SD Gothic Neo",sans-serif;
  --num:"Nunito","Jua",-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;min-height:100%;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{color:var(--tx);font-family:var(--kr);background:var(--grass) repeating-linear-gradient(135deg,transparent 0 64px,rgba(150,178,40,.24) 64px 128px);
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
/* 아이폰: 그림을 꾹 눌러도 끌어 옮기기·복사·저장 메뉴가 뜨지 않게, 그림은 손가락을 받지 않고 감싼 버튼·칸이 받아요 */
img{-webkit-user-drag:none;pointer-events:none}
[hidden]{display:none!important}
svg{display:block}
.ol{color:#fff;-webkit-text-stroke:5px var(--grass-s);paint-order:stroke fill}

/* ---------- 공통 부품: 짙은 갈색 외곽선 + 아래 두께 ---------- */
.pb{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:54px;padding:0 28px;border-radius:18px;background:var(--or);--s:var(--or-s);border:3px solid var(--s);
  box-shadow:inset 0 -5px 0 var(--or-d);font-size:21px;color:#fff;-webkit-text-stroke:5px var(--s);paint-order:stroke fill;transition:transform .08s,box-shadow .08s}
.pb:active{transform:translateY(3px);box-shadow:inset 0 -3px 0 var(--or-d)}
.pb.green{--s:var(--green-s);background:var(--green);box-shadow:inset 0 -5px 0 var(--green-d)}
.pb.cr{--s:var(--cream-s);background:var(--cream);color:var(--tx);-webkit-text-stroke:0;box-shadow:inset 0 -5px 0 var(--cream2)}
.pb.sm{height:44px;padding:0 20px;font-size:18px;border-radius:15px}
.sq{flex:none;width:48px;height:48px;border-radius:15px;background:var(--wood);border:3px solid var(--wood-s);box-shadow:inset 0 -5px 0 rgba(120,60,10,.3);display:grid;place-items:center}
.bo{stroke:var(--wood-s)}
.sq:active{transform:translateY(2px)}
.pill{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 13px;border-radius:99px;background:var(--cream);border:3px solid var(--cream-s);font-family:var(--num);font-weight:900;font-size:15px;color:var(--tx)}
.pill img{width:22px;height:22px;object-fit:contain}
.btn-txt{height:44px;font-size:16px;color:var(--sub)}
.stars{display:flex;justify-content:center}
.stars img{width:16px;height:16px;object-fit:contain}
.stars img.off{filter:grayscale(1) brightness(1.3);opacity:.45}
.catimg{display:block;width:100%;height:auto;pointer-events:none}
.glow{position:absolute;width:108px;height:63px;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,248,170,0) 72%,rgba(255,248,170,.75) 81%,#FFFFF0 88%,rgba(255,248,170,.75) 94%,rgba(255,248,170,0) 100%);animation:glow 1.6s ease-in-out infinite}
/* 빛 링은 발판 원통 밑동과 같은 중심의 땅 위 동그라미: 원통 둘레에서 일정하게 떨어져 앞·옆·뒤로 고리가 다 보여요 */
@keyframes glow{50%{opacity:.5}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.say{position:relative;align-self:center;max-width:320px;background:#fff;border:3px solid var(--white-s);border-radius:20px;padding:12px 20px;font-size:19px;line-height:1.4;text-align:center;}
.say::after{content:"";position:absolute;left:50%;bottom:-10px;width:15px;height:15px;margin-left:-8px;background:#fff;border:solid var(--white-s);border-width:0 3px 3px 0;transform:rotate(45deg)}

/* ---------- 난이도 고르기 ---------- */
#onb{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:28px 18px calc(28px + env(safe-area-inset-bottom))}
.stand{position:relative;width:180px;height:196px;margin:18px auto 20px}
.stand .stump{position:absolute;left:50%;bottom:0;width:112px;transform:translateX(-50%)}
.stand .glow{left:50%;bottom:-10px;top:auto;transform:translate(-50%,0);width:186px;height:108px}
.stand .c{position:absolute;left:50%;bottom:58px;width:124px;margin-left:-62px;animation:bob 2.4s ease-in-out infinite}
.choices{display:flex;flex-direction:column;gap:12px}
.choice{display:flex;align-items:center;gap:12px;width:100%;padding:8px 14px 8px 8px;text-align:left;background:var(--cream);border:3px solid var(--cream-s);border-radius:20px;box-shadow:inset 0 -5px 0 var(--cream2)}
.choice:active{transform:translateY(3px);box-shadow:inset 0 -3px 0 var(--cream2)}
.choice img{flex:none;width:62px;height:62px;object-fit:contain}
.choice span{flex:1;min-width:0}
.choice b{display:block;font-weight:400;font-size:20px}
.choice small{font-size:14px;color:var(--sub)}
.choice em{flex:none;font-style:normal;font-size:13px;line-height:1.25;text-align:center;color:#fff;background:var(--wood);border:2.5px solid var(--wood-s);border-radius:12px;padding:5px 8px 4px}
.onb-go{display:flex;flex-direction:column;gap:12px}

/* ---------- 지도 ---------- */
#map{position:relative}
.world{position:relative;z-index:0;max-width:480px;margin:0 auto;overflow:hidden}
/* 단계 팝업 층: 지도와 같은 좌표계로 겹쳐 두고, 오른쪽 메뉴·HUD(z 50)보다 위에 올려요 */
.poplayer{position:absolute;left:0;right:0;top:0;height:0;max-width:480px;margin:0 auto;z-index:60}
.world>svg{position:absolute;left:0;top:0}
.dc{position:absolute;transform:translate(-50%,-100%);pointer-events:none}
.dc img{display:block;width:100%}
.dc.flip img{transform:scaleX(-1)}
.sh{position:absolute;transform:translate(-50%,-50%);border-radius:50%;background:rgba(95,125,15,.3);pointer-events:none}
.node{position:absolute;width:76px;height:64px;transform:translate(-50%,-50%)}
.node>img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain}
.node b{position:absolute;left:0;right:0;top:15%;text-align:center;font-family:var(--num);font-weight:900;font-size:22px;line-height:1;color:#fff;-webkit-text-stroke:6px #626262;paint-order:stroke fill}
.node.done b,.node.open b{top:12%;-webkit-text-stroke-color:#8C5524}
.node .ns{position:absolute;left:50%;top:86%;transform:translateX(-50%);display:flex}
.node .ns img{width:19px;height:19px}
.node.lock{filter:saturate(.9)}
.node.open>*{animation:bob 1.6s ease-in-out infinite}
.node.just .ns img{animation:starpop .6s cubic-bezier(.3,1.6,.5,1) both}
.node.just .ns img:nth-child(2){animation-delay:.12s}.node.just .ns img:nth-child(3){animation-delay:.24s}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}}
.hero{position:absolute;display:block;width:80px;transform:translate(-50%,-100%);transition:left .8s ease-in-out,top .8s ease-in-out;cursor:pointer}
.hero img{display:block;width:100%;animation:bob 1.6s ease-in-out infinite}   /* 발판(.node.open)과 같은 박자로 함께 떠올라요 */
.hero.drop{animation:drop .7s cubic-bezier(.3,1.4,.5,1) both}
@keyframes drop{from{transform:translate(-50%,-190%);opacity:0}}
.pin{position:absolute;left:50%;bottom:100%;margin-bottom:6px;transform:translateX(-50%);background:var(--pink);border:3px solid var(--pink-s);border-radius:14px;padding:5px 11px 4px;white-space:nowrap;
  font-size:16px;color:#fff;-webkit-text-stroke:4px var(--pink-s);paint-order:stroke fill;animation:pinb 1.6s ease-in-out infinite}
.pin::after{content:"";position:absolute;left:50%;top:100%;width:12px;height:12px;margin:-7px 0 0 -6px;background:var(--pink);border:solid var(--pink-s);border-width:0 3px 3px 0;transform:rotate(45deg)}
@keyframes pinb{50%{transform:translateX(-50%) translateY(-5px)}}
.sign{position:absolute;width:132px;transform:translate(-50%,-100%)}
.sign img{display:block;width:100%}
.sign span{position:absolute;left:10%;right:10%;top:9%;height:62%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;color:var(--tx)}
.sign small{font-size:12.5px;color:var(--sub)}
.sign b{font-weight:400;font-size:19px}
.pop{position:absolute;width:224px;transform:translate(-50%,-100%);margin-top:-30px;background:var(--cream);border:3px solid var(--cream-s);border-radius:20px;padding:12px 14px 14px;text-align:center;animation:popin .18s ease-out}
.pop::after{content:"";position:absolute;left:var(--ax,50%);top:100%;width:16px;height:16px;margin:-6px 0 0 -8px;background:var(--cream);border:solid var(--cream-s);border-width:0 3px 3px 0;transform:rotate(45deg)}
@keyframes popin{from{opacity:0;margin-top:-18px}}
.pop b{display:block;font-weight:400;font-size:20px}
.pop small{display:block;font-size:14px;color:var(--sub);margin:2px 0 8px}
.pop .pp{display:block;width:86px;height:86px;margin:0 auto 6px;background:#fff;border:3px solid var(--white-s);border-radius:12px;padding:7px}
.pop .pp svg{width:100%;height:100%}
.pop .pp.q{display:grid;place-items:center;background:var(--cream2);border-color:var(--cream-s);font-family:var(--num);font-weight:900;font-size:40px;color:#E0BF8E;padding:0}
.pop .stars{margin:-4px 0 8px}
.pop .stars img{width:22px;height:22px}
.pop .pb{width:100%}
.pop .pl{display:block;width:64px;margin:0 auto 4px;filter:grayscale(.2)}

.hud{position:fixed;z-index:50;top:calc(env(safe-area-inset-top) + 10px);left:max(10px,calc(50vw - 230px));right:max(84px,calc(50vw - 160px))}
.secbtn{display:flex;align-items:center;gap:8px;max-width:100%;padding:5px 12px 6px 6px;text-align:left;background:var(--cream);border:3px solid var(--cream-s);border-radius:20px;box-shadow:inset 0 -5px 0 var(--cream2)}
.secbtn:active{transform:translateY(3px)}
.secbtn img{flex:none;width:48px;height:48px;object-fit:contain}
.secbtn .t{min-width:0;flex:1}
.secbtn b{display:block;font-weight:400;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.secbtn small{display:block;font-size:13px;color:var(--sub);white-space:nowrap}
.secbtn .chev{flex:none;width:28px;height:28px;border-radius:50%;background:var(--wood);border:2.5px solid var(--wood-s);display:grid;place-items:center}
.bar{display:block;height:11px;border-radius:99px;background:var(--cream2);border:2px solid var(--cream-s);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;min-width:6px;background:var(--or);border-right:2px solid var(--or-s)}
.rail{position:fixed;z-index:50;top:calc(env(safe-area-inset-top) + 92px);right:max(0px,calc(50vw - 240px));display:flex;flex-direction:column;gap:10px}
.rail button{position:relative;width:70px;height:68px;padding:2px 0 0 4px;background:var(--wood);border:3px solid var(--wood-s);border-right:0;border-radius:20px 0 0 20px;
  box-shadow:inset 0 -5px 0 rgba(120,60,10,.3);display:flex;flex-direction:column;align-items:center;justify-content:center}
.rail button:active{transform:translateX(3px)}
.rail img{width:42px;height:42px;object-fit:contain}
.rail span{font-size:13px;line-height:1;color:#fff;-webkit-text-stroke:4px var(--wood-s);paint-order:stroke fill;margin-top:-2px}
.rail .q{font-family:var(--num);font-weight:900;font-size:30px;line-height:42px;color:#fff;-webkit-text-stroke:6px var(--wood-s);paint-order:stroke fill}
.rail em{position:absolute;top:-8px;left:-10px;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--pink);border:2.5px solid var(--pink-s);color:#fff;font-style:normal;font-family:var(--num);font-weight:900;font-size:13px;display:grid;place-items:center}
.rail .dot{position:absolute;top:5px;left:6px;width:13px;height:13px;border-radius:50%;background:var(--red);border:2.5px solid var(--red-s)}
.me{position:fixed;z-index:50;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);display:flex;align-items:center;gap:4px;height:46px;padding:0 16px 0 6px;
  background:var(--cream);border:3px solid var(--cream-s);border-radius:99px;font-size:16px}
.me img{width:38px;height:38px;object-fit:cover;object-position:50% 10%;border-radius:50%}

/* ---------- 모은 그림 ---------- */
#gal{max-width:480px;margin:0 auto;min-height:100vh;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
.gtop{position:sticky;top:0;z-index:5;margin:0 -16px;padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;background:linear-gradient(var(--grass) 86%,rgba(197,210,58,0))}
.ghead{display:flex;align-items:center;gap:10px}
.ghead h1{flex:1;margin:0;font-weight:400;font-size:27px}
.gsub{margin:2px 2px 12px;font-size:15px;color:#fff;-webkit-text-stroke:4px var(--grass-s);paint-order:stroke fill;line-height:1.4}
/* 난이도 탭: 작은 알약 한 줄(넘치면 옆으로 밀어요). 누르면 그 난이도로 이동하고, 내려 보면 지금 보는 난이도에 불이 들어와요. */
.gtabs{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.gtabs::-webkit-scrollbar{display:none}
.gtabs button{flex:none;height:32px;padding:1px 11px 0;border-radius:99px;background:var(--cream);border:2.5px solid var(--cream-s);font-size:14px;line-height:1;color:var(--tx)}
.gtabs button.on{background:var(--or);border-color:var(--or-s);color:#fff;-webkit-text-stroke:3px var(--or-s);paint-order:stroke fill}
.gsec{margin-bottom:26px}
.gsec:last-child{min-height:calc(100vh - 150px);min-height:calc(100dvh - 150px)}
.gst{display:flex;align-items:center;gap:8px;margin:6px 2px 12px;font-weight:400}
.gst b{font-weight:400;font-size:22px}
.gst small{flex:1;min-width:0;font-size:14px;color:#fff;-webkit-text-stroke:3.5px var(--grass-s);paint-order:stroke fill;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gst span{flex:none;font-family:var(--num);font-weight:900;font-size:13.5px;line-height:1;background:var(--cream);border:2.5px solid var(--cream-s);border-radius:99px;padding:5px 10px 4px;color:var(--tx)}
.frames{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 12px}
.fr{display:flex;flex-direction:column;align-items:center;min-width:0}
.fr .cv{display:block;width:100%;aspect-ratio:1;background:#fff;border:7px solid #E0A55A;border-radius:10px;box-shadow:0 0 0 3px var(--frame-s);padding:9%}
.fr .cv svg{width:100%;height:100%}
.fr.q .cv{display:grid;place-items:center;padding:0;background:var(--cream2);font-family:var(--num);font-weight:900;font-size:36px;color:#E3C495}
.fr.q.lockd .cv{border-color:#BDAE96;box-shadow:0 0 0 3px #8F806A;background:#EDE2CF;color:#CDBEA5}
.fr.q.open .cv{border-color:var(--or);box-shadow:0 0 0 3px var(--or-s);color:var(--or)}
.fr .cap{max-width:100%;margin-top:12px;padding:3px 10px 2px;background:var(--cream);border:2.5px solid var(--cream-s);border-radius:99px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr .stars{height:20px;margin-top:3px}
.fr .go{margin-top:3px;font-size:13px;color:#fff;-webkit-text-stroke:3.5px var(--grass-s);paint-order:stroke fill}
.fr:active .cv{transform:translateY(2px)}

/* ---------- 게임 ---------- */
#game{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(14px + env(safe-area-inset-bottom))}
.gbar{display:flex;align-items:center;gap:8px}
.gbar .title{flex:1;min-width:0;text-align:center}
.plaque{display:inline-block;max-width:100%;background:var(--wood);border:3px solid var(--wood-s);border-radius:14px;box-shadow:inset 0 -4px 0 rgba(120,60,10,.3);
  padding:7px 18px 6px;font-size:20px;color:#fff;-webkit-text-stroke:5px var(--wood-s);paint-order:stroke fill;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbar .time{min-width:66px;justify-content:center;font-variant-numeric:tabular-nums}
.status{display:flex;align-items:center;gap:10px;padding:12px 0 6px}
.status .masc{position:relative;flex:none;width:60px;height:60px;border-radius:50%;border:3px solid var(--sky-s);background:#BDEBF3;overflow:hidden}
.status .masc img{position:absolute;width:150%;max-width:none;left:-25%;top:6%}
.status .masc.jump{animation:jump .45s}
@keyframes jump{30%{transform:translateY(-8px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
.bubble{flex:1;min-width:0;position:relative;background:#fff;border:3px solid var(--white-s);border-radius:16px;padding:8px 12px 7px;font-size:15px;line-height:1.3;word-break:keep-all}
.bubble::before{content:"";position:absolute;left:-8px;top:50%;width:12px;height:12px;margin-top:-6px;background:#fff;border:solid var(--white-s);border-width:0 0 3px 3px;transform:rotate(45deg)}
.hearts{display:flex;flex:none}
.hearts img{width:31px;height:31px;object-fit:contain;transition:transform .25s,filter .25s,opacity .25s}
.hearts .hn{font-family:var(--num);font-weight:900;font-size:22px;color:var(--red);-webkit-text-stroke:5px #fff;paint-order:stroke fill;margin:0 2px 0 -4px;align-self:center}
.hearts img.off{transform:scale(.8);filter:grayscale(1) brightness(1.2);opacity:.45}
.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;touch-action:none}
.wrap{position:relative;touch-action:none;background:var(--cream);border:7px solid var(--wood);border-radius:20px;padding:5px;box-shadow:0 0 0 3px var(--wood-s)}
.board{display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;font-family:var(--num);font-weight:900;font-variant-numeric:tabular-nums}
.corner{grid-row:1;grid-column:1}
/* 큰 판 확대: 나무 틀이 스크롤 영역이 되고, 숫자 띠는 위·왼쪽에 붙어 있어요(어느 줄 숫자인지 계속 보이게) */
.wrap.zoom{padding:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.wrap.zoom::-webkit-scrollbar{display:none}
.wrap.zoom .colclues{position:sticky;top:0;z-index:2;border-radius:0}
.wrap.zoom .rowclues{position:sticky;left:0;z-index:2;border-radius:0}
.wrap.zoom .corner{position:sticky;top:0;left:0;z-index:3;background:var(--cream)}
/* 판은 칸 크기대로 넓어지고(틀 폭에 맞춰 줄어들지 않게) 틀 안에서 스크롤돼요 */
.wrap.zoom .board,.wrap.mini .board{width:max-content}
.wrap.zoom .cc,.wrap.mini .cc{flex:none;padding:4px 0 3px}
.wrap.zoom .cc span,.wrap.mini .cc span{line-height:1.02}
.wrap.zoom .rc,.wrap.mini .rc{gap:calc(var(--fs)*.28);padding:0 5px}
/* 전체 판(확대 전) 큰 판: 확대했을 때와 똑같이 그린 판(숫자 띠 포함)을 통째로 줄여 한 화면에 보여요 */
.wrap.mini{overflow:hidden;cursor:zoom-in}
.wrap.mini .board{transform-origin:0 0}
.ovhint{position:absolute;left:50%;bottom:16px;z-index:4;pointer-events:none;display:flex;align-items:center;gap:6px;padding:8px 15px 7px;border-radius:99px;background:rgba(74,42,20,.86);color:#fff;font-size:15px;line-height:1;white-space:nowrap;transform:translateX(-50%);animation:ovh 1.6s ease-in-out infinite}
.ovhint svg{width:18px;height:18px;flex:none}
@keyframes ovh{50%{transform:translateX(-50%) translateY(-4px)}}
.colclues{grid-column:2;display:flex;border-radius:10px 10px 0 0;overflow:hidden;margin-right:2px}
.cc{width:var(--cell);background:var(--clue);box-shadow:inset -1px 0 0 rgba(140,85,36,.16);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:6px 0 4px;gap:1px;transition:background .15s}
.rowclues{grid-row:2;display:flex;flex-direction:column;border-radius:10px 0 0 10px;overflow:hidden;margin-bottom:2px}
.rc{height:var(--cell);background:var(--clue);box-shadow:inset 0 -1px 0 rgba(140,85,36,.16);display:flex;justify-content:flex-end;align-items:center;padding:0 6px 0 8px;gap:calc(var(--fs)*.42);transition:background .15s}
.cc.s5{box-shadow:inset -2px 0 0 rgba(140,85,36,.4)}
.rc.s5{box-shadow:inset 0 -2px 0 rgba(140,85,36,.4)}
/* 칸은 늘 1:1: 다섯 칸 묶음의 굵은 흰 틈(2px)·마지막 줄(틈 없음)만큼 칸 자리를 늘리고 줄여서 칠해지는 안쪽은 모든 칸이 같은 정사각형이에요 */
.cc.s5{width:calc(var(--cell) + 1px)}.cc.e{width:calc(var(--cell) - 1px)}
.rc.s5{height:calc(var(--cell) + 1px)}.rc.e{height:calc(var(--cell) - 1px)}
.cc span{transform-origin:50% 50%}
.cc span,.rc span{font-size:var(--fs);line-height:1.12;color:var(--tx);transition:opacity .2s}
.cc span.d,.rc span.d{opacity:.28}
.cc span[data-w]{font-size:calc(var(--fs)*.88);letter-spacing:-.07em}
.board.tiny .cc span[data-w]{font-size:calc(var(--fs)*.8);letter-spacing:-.11em}   /* 30×30 확대 전: 두 자리 수가 옆 칸 숫자와 붙지 않게 칸 폭 안으로 */
.cc.hl,.rc.hl{background:var(--clue-hl)}
.grid{grid-row:2;grid-column:2;display:grid;grid-template-columns:repeat(var(--n),var(--cell));grid-auto-rows:var(--cell);
  border-right:2px solid var(--gb);border-bottom:2px solid var(--gb);border-radius:0 0 10px 0;overflow:hidden;background:var(--cellbg);touch-action:none;cursor:pointer}
/* 기본칸은 테두리(짙은 선) 없이 아주 연한 노란 타일이고, 칸 사이·5칸 묶음은 흰 틈으로만 나눠요(사용자 지시 11/26) */
.cell{border-right:1px solid var(--gl);border-bottom:1px solid var(--gl);position:relative;transition:border-color .5s}
.cell.br{border-right:2px solid var(--gb)}
.cell.bb{border-bottom:2px solid var(--gb)}
.cell.lc{border-right:0}.cell.lr{border-bottom:0}
.cell.f::before{content:"";position:absolute;inset:0;background:var(--c);animation:pop .2s cubic-bezier(.3,1.5,.5,1)}
.cell.x::after{content:"";position:absolute;inset:27%;
  background:linear-gradient(45deg,transparent 40%,var(--x) 40%,var(--x) 60%,transparent 60%),linear-gradient(-45deg,transparent 40%,var(--x) 40%,var(--x) 60%,transparent 60%);
  animation:pop .18s ease-out;transition:opacity .4s}
.cell.bad.x::after{inset:20%;background:linear-gradient(45deg,transparent 39%,var(--coral) 39%,var(--coral) 61%,transparent 61%),linear-gradient(-45deg,transparent 39%,var(--coral) 39%,var(--coral) 61%,transparent 61%)}
.cell.bad.f::before{animation:badfill .9s ease-out}
.cell.hint::before{animation:hint 1.1s ease-out}
@keyframes pop{from{transform:scale(.3);opacity:.3}to{transform:none;opacity:1}}
@keyframes badfill{0%,60%{background:var(--coral)}100%{background:var(--c)}}
@keyframes hint{0%{transform:scale(.3)}30%{transform:scale(1.25);filter:brightness(1.35)}100%{transform:none;filter:none}}
.board.shake{animation:shake .32s}
/* ---------- 타격감: 한 줄 완성·그림 완성 ---------- */
.stage{position:relative}
.wrap{z-index:1}
.grid{position:relative}
.sweep{position:absolute;z-index:3;pointer-events:none;background-repeat:no-repeat;background-color:rgba(255,236,150,.28);animation:sweepH .46s ease-out forwards}
.sweep.h{left:0;right:0;background-image:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.95),rgba(255,255,255,0));background-size:45% 100%}
.sweep.v{top:0;bottom:0;background-image:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.95),rgba(255,255,255,0));background-size:100% 45%;animation-name:sweepV}
.sweep.rev{animation-direction:reverse}
@keyframes sweepH{0%{background-position:-100% 0;opacity:1}75%{opacity:1}100%{background-position:200% 0;opacity:0}}
@keyframes sweepV{0%{background-position:0 -100%;opacity:1}75%{opacity:1}100%{background-position:0 200%;opacity:0}}
.spk{position:absolute;z-index:30;pointer-events:none;width:var(--s,16px);height:var(--s,16px);margin:calc(var(--s,16px)/-2) 0 0 calc(var(--s,16px)/-2);background:center/contain no-repeat;animation:spk var(--t,.6s) cubic-bezier(.15,.8,.35,1) forwards}
@keyframes spk{0%{transform:translate(0,0) scale(.3) rotate(0);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(var(--r,90deg));opacity:0}}
.wfx-flash{position:absolute;inset:0;border-radius:13px;background:#fff;z-index:5;pointer-events:none;animation:wflash .55s ease-out forwards}
@keyframes wflash{from{opacity:.92}to{opacity:0}}
.wfx-ring{position:absolute;z-index:4;pointer-events:none;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:9px solid rgba(255,255,255,.95);box-shadow:0 0 22px rgba(255,236,140,.95);animation:wring .75s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes wring{from{transform:scale(.2);opacity:1}to{transform:scale(4.4);opacity:0}}
.wfx-rays{position:absolute;z-index:0;pointer-events:none;width:680px;height:680px;margin:-340px 0 0 -340px;border-radius:50%;
  background:repeating-conic-gradient(rgba(255,251,205,.6) 0 9deg,rgba(255,251,205,0) 9deg 22deg);
  -webkit-mask:radial-gradient(closest-side,#000 25%,transparent 100%);mask:radial-gradient(closest-side,#000 25%,transparent 100%);animation:wrays 1.6s ease-out forwards}
@keyframes wrays{0%{transform:scale(.35) rotate(0);opacity:0}22%{opacity:1}100%{transform:scale(1.1) rotate(35deg);opacity:0}}
.wfx-stamp{position:absolute;z-index:6;pointer-events:none;font-size:54px;line-height:1;white-space:nowrap;color:#fff;-webkit-text-stroke:11px var(--or-s);paint-order:stroke fill;text-shadow:0 5px 0 rgba(120,60,10,.25);animation:wstamp 1.35s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes wstamp{0%{transform:translate(-50%,-50%) scale(2.8) rotate(-10deg);opacity:0}16%{transform:translate(-50%,-50%) scale(.9) rotate(-5deg);opacity:1}26%{transform:translate(-50%,-50%) scale(1.06) rotate(-5deg)}34%{transform:translate(-50%,-50%) scale(1) rotate(-5deg)}82%{opacity:1}100%{transform:translate(-50%,-50%) scale(1.04) rotate(-5deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.sweep,.spk,.wfx-ring,.wfx-rays{display:none}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.board.won .cell{border-color:transparent}
.board.won .cell.f::before{inset:0 -2px -2px 0}
.board.won .cell.x::after{opacity:0}
.board.bare .colclues,.board.bare .rowclues,.board.bare .corner{display:none}
.board.bare .grid{border:2px solid var(--gb);border-radius:10px}
.controls{display:flex;align-items:flex-start;justify-content:center;gap:12px;padding-top:16px}
.cbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:14px;color:#fff;-webkit-text-stroke:4px var(--grass-s);paint-order:stroke fill}
.cbtn .o{--s:var(--cream-s);width:72px;height:62px;border-radius:18px;background:var(--cream);border:3px solid var(--s);box-shadow:inset 0 -5px 0 var(--cream2);display:grid;place-items:center;color:#E3C79F;-webkit-text-stroke:0;transition:transform .08s}
.cbtn.on .o{--s:var(--or-s);background:var(--or);box-shadow:inset 0 -5px 0 var(--or-d);color:#fff}
.cbtn:active .o{transform:translateY(3px)}
.cbtn .ic{width:24px;height:24px;border-radius:6px;background:currentColor;box-shadow:0 0 0 3px var(--s)}
.cbtn .xo{stroke:var(--s)}
.cbtn .o svg{width:30px;height:30px}
.cbtn .o img{width:44px;height:44px;object-fit:contain}
.cbtn em{position:absolute;top:-8px;right:-8px;min-width:26px;height:26px;border-radius:13px;background:var(--pink);border:2.5px solid var(--pink-s);color:#fff;font-style:normal;font-family:var(--num);font-weight:900;font-size:13px;-webkit-text-stroke:0;display:grid;place-items:center;padding:0 5px}
.cbtn:disabled{opacity:.5}
/* 확대 버튼까지 4개일 때 좁은 폰에서도 한 줄에 들어오게 */
.controls.four{gap:8px}
/* 큰 판을 세로가 짧은 폰에서 볼 때: 말풍선·하트·버튼을 줄여 판 자리를 넓혀요 */
#game.tight .status{padding:6px 0 2px;gap:8px}
/* 큰 판 조준점(손가락 위에 뜨는 과녁): 손끝에 가리지 않게 손가락보다 위 칸을 겨눠요 */
.status{position:relative}
.status.aiming .bubble{visibility:hidden}
.readout{position:absolute;z-index:3;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:3px 12px;background:#fff;border:3px solid #FFB061;border-radius:16px;
  font-family:var(--num);font-weight:900;color:var(--tx);overflow:hidden;pointer-events:none}
.readout[hidden]{display:none}
.readout .ro{display:flex;align-items:center;gap:7px;white-space:nowrap;font-size:var(--rf,19px);line-height:1.1}
.readout .ro em{flex:none;min-width:46px;font-style:normal;font-family:var(--kr);font-weight:400;font-size:13px;color:var(--sub)}
.readout .ro b.d{opacity:.28}
.aimo{position:absolute;pointer-events:none;z-index:4;display:none}
.wrap.aiming .aimo{display:block}
.wrap.aiming .aimo.ln{display:none}
.wrap.aiming.line .aimo.ln{display:block}
.aimo.rw,.aimo.cl{background:rgba(255,158,59,.2)}
.aimo.ln{background:rgba(255,122,26,.42);border-radius:2px}
.aimo.dot{background:rgba(255,122,26,.6);border-radius:1px}
.aimo.ring{width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:3px solid #FF7A1A;box-shadow:0 0 0 2px #fff,inset 0 0 0 2px #fff;transition:transform .12s}
.aimo.ring.charge{animation:aimch .48s linear forwards}
.aimo.ring.lock{transform:scale(.72);background:rgba(255,122,26,.25)}
@keyframes aimch{from{transform:scale(1)}to{transform:scale(.8)}}
.aimo.num{margin:-46px 0 0;transform:translateX(-50%);padding:3px 9px 2px;border-radius:99px;background:#FF7A1A;color:#fff;font-family:var(--num);font-weight:900;font-size:14px;white-space:nowrap;box-shadow:0 0 0 2px #fff}
.wrap.aiming .aimo.num:empty{display:none}
#game.tight .status .masc{width:44px;height:44px}
#game.tight .bubble{font-size:14px;line-height:1.25;padding:6px 10px 5px}
#game.tight .hearts img{width:26px;height:26px}
#game.tight .hearts .hn{font-size:19px}
#game.tight .controls{padding-top:8px}
#game.tight .cbtn{gap:3px;font-size:13px}
#game.tight .cbtn .o{height:50px;border-radius:15px}
#game.tight .cbtn .o img{width:36px;height:36px}
.controls.four .cbtn .o{width:62px}
.sep{width:3px;height:40px;margin-top:12px;border-radius:2px;background:rgba(74,42,20,.25)}

/* ---------- 시트 ---------- */
/* 시트가 화면보다 길면(작은 폰의 도움말·완성 시트) 위가 잘리지 않게, 어두운 배경을 스크롤 영역으로 두고 시트는 margin-top:auto 로 바닥에 붙여요 */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(40,28,10,.5);display:flex;flex-direction:column;align-items:center;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding-top:calc(env(safe-area-inset-top) + 96px);animation:fade .2s}
.sheet{position:relative;flex-shrink:0;margin-top:auto;width:100%;max-width:440px;background:var(--cream);border:3px solid var(--cream-s);border-bottom:0;border-radius:28px 28px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));text-align:center;animation:up .32s cubic-bezier(.3,1.4,.5,1)}
@media (min-width:520px){.sheet{margin-bottom:auto;border-radius:28px;border-bottom:3px solid var(--cream-s);}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.sheet .masc{width:104px;margin:-86px auto 0}
.sheet .masc.happy{animation:hop .7s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-12px) rotate(-5deg)}}
.sheet .sic{display:block;width:84px;margin:-58px auto 0}
.sheet h2{margin:6px 0 4px;font-weight:400;font-size:28px;color:var(--or);-webkit-text-stroke:5px var(--or-s);paint-order:stroke fill}
.sheet p{margin:0;font-size:16px;color:var(--sub);line-height:1.45}
.sheet .frame{display:inline-block;margin:14px auto 4px;background:#fff;border:7px solid #E0A55A;border-radius:10px;box-shadow:0 0 0 3px var(--frame-s);padding:8px 8px 6px;transform:rotate(-3deg)}
.sheet .frame svg{width:118px;height:118px}
.sheet .frame span{display:block;font-size:18px;margin-top:4px}
.sheet .frame.big svg{width:170px;height:170px}
.sheet .frame+p{margin-top:12px}
.sheet .bigstars{display:flex;justify-content:center;gap:4px;margin:14px 0 0}
.sheet .bigstars img{width:46px;height:46px}
.sheet .meta{display:flex;justify-content:center;gap:10px;margin:14px 0 0}
.sheet .meta div{background:#fff;border:3px solid var(--white-s);border-radius:14px;padding:6px 16px 5px;font-size:13px;color:var(--sub)}
.sheet .meta b{display:block;font-family:var(--num);font-weight:900;font-size:20px;color:var(--tx);font-variant-numeric:tabular-nums}
.btns{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.secs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.sc{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;width:100%;min-width:0;padding:8px 8px 10px;background:#fff;border:3px solid var(--white-s);border-radius:18px;box-shadow:inset 0 -4px 0 #F1E6D6}
.sc:active{transform:translateY(2px)}
.sc.cur{background:#FFF0C4;border-color:#E3BC5C;box-shadow:none}
.sc img{flex:none;width:46px;height:46px;object-fit:contain}
.sc .bar{width:78%}
.sc .t{flex:1;min-width:0}
.sc b{display:block;font-weight:400;font-size:16px;white-space:nowrap}
.sc small{display:block;font-size:12.5px;color:var(--sub);white-space:nowrap}
.sc .here{position:absolute;top:-10px;right:6px;font-size:12px;color:#fff;background:var(--or);border:2px solid var(--or-s);border-radius:99px;padding:1px 8px 0}
.sc .sz{flex:none;width:60px;font-family:var(--num);font-weight:900;font-size:19px;text-align:center}
.sc .pb{flex:none}
.week{display:flex;gap:4px;margin:16px 0 0}
.week button{flex:1;height:58px;border-radius:13px;background:#fff;border:2.5px solid var(--white-s);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12.5px;color:var(--sub)}
.week b{font-family:var(--num);font-weight:900;font-size:16px;color:var(--tx)}
.week img{width:20px;height:20px}
.week .done{background:#E2F3B4;border-color:#9DC55A}
.week .today{background:#FFE7A8;border-color:#E3B24E}
.how{text-align:left;margin:16px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.how li{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.5;background:#fff;border:2.5px solid var(--white-s);border-radius:14px;padding:9px 12px}
.how li b{flex:none;width:27px;height:27px;border-radius:50%;background:var(--wood);border:2.5px solid var(--wood-s);color:#fff;font-family:var(--num);font-weight:900;display:grid;place-items:center;font-size:14px}
.how strong{font-weight:400;color:var(--or-d)}
.demo{display:inline-flex;margin:14px auto 0;font-family:var(--num);font-weight:900;font-size:17px;border-radius:10px;overflow:hidden;border:3px solid var(--clue-s)}
.demo span{background:var(--clue);color:var(--tx);padding:6px 10px 4px 12px}
.demo u{width:30px;border-left:1px solid var(--gl);background:var(--cellbg);text-decoration:none}
.demo u.f{background:var(--red)}
.note{margin-top:12px!important;font-size:13px!important}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:4px;border:2px solid rgba(60,30,0,.22);animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
.toast{position:fixed;z-index:200;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:#fff;border:3px solid var(--white-s);border-radius:14px;padding:8px 16px 7px;font-size:16px;white-space:nowrap;animation:toast 2s forwards;pointer-events:none}
@keyframes toast{0%{opacity:0;margin-bottom:-10px}12%,80%{opacity:1;margin-bottom:0}100%{opacity:0}}
/* 키가 작은 폰(사파리 주소창·아래 막대를 뺀 높이): 시트를 줄여 맨 아래 버튼까지 한 화면에 들어오게 해요 */
@media (max-height:760px){
  .overlay{padding-top:calc(env(safe-area-inset-top) + 74px)}
  .sheet{padding-top:12px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .sheet .masc{width:84px;margin-top:-70px}
  .sheet .sic{width:72px;margin-top:-50px}
  .sheet h2{font-size:25px;margin:2px 0}
  .sheet .frame{margin-top:10px}
  .sheet .frame svg{width:96px;height:96px}
  .sheet .frame.big svg{width:132px;height:132px}
  .sheet .frame span{font-size:16px;margin-top:2px}
  .sheet .frame+p{margin-top:8px}
  .sheet .bigstars{margin-top:8px}
  .sheet .bigstars img{width:38px;height:38px}
  .sheet .meta{margin-top:8px}
  .btns{gap:6px;margin-top:14px}
  .how{gap:6px;margin-top:10px}
  .how li{font-size:14px;line-height:1.42;padding:7px 10px}
  .demo{margin-top:10px}
  .note{margin-top:8px!important}
  .secs{gap:8px;margin-top:12px}
  .sc{padding:6px 6px 8px}
  .sc img{width:40px;height:40px}
}
/* 아이폰 SE(2·3세대) 사파리처럼 더 낮은 화면 */
@media (max-height:620px){
  .overlay{padding-top:calc(env(safe-area-inset-top) + 62px)}
  .sheet{padding-top:8px}
  .sheet .masc{width:72px;margin-top:-60px}
  .sheet h2{font-size:23px}
  .sheet p{font-size:15px;line-height:1.38}
  .sheet .frame{padding:6px 6px 4px;border-width:6px}
  .sheet .frame svg{width:78px;height:78px}
  .sheet .frame.big svg{width:110px;height:110px}
  .sheet .bigstars img{width:32px;height:32px}
  .sheet .meta div{padding:4px 14px 3px}
  .sheet .meta b{font-size:18px}
  .pb{height:50px}
  .btns{margin-top:10px}
  .how li{font-size:13.5px;padding:6px 9px}
  .demo{display:none}
  .secs{gap:6px;margin-top:8px}
  .sc{padding:4px 6px 6px}

<script src="core.js"></script>
<script>
(function () {
  'use strict';
  const { PAL, parse, colorsOf, allClues, generate } = Nono;
  // 안드로이드 앱(Capacitor) 안에서 돌 때만 true예요. 웹사이트에서는 아래 앱 전용 처리가 모두 건너뛰어져요.
  const CAP = window.Capacitor, NATIVE = !!(CAP && CAP.isNativePlatform && CAP.isNativePlatform());
  // 운영 중인 구간: 우선 30×30(5구간)까지만 열어요. 55×55 마스터(6구간)는 core.js 에 그대로 두고 잠시 쉬어요(2026-11-26). 다시 열려면 OFF 에서 빼요.
  const OFF = ['master'], PACKS = Nono.PACKS.filter((p) => !OFF.includes(p.id));
  const KEY = 'kokkok-nonogram-v1';
  // 하트·힌트 개수: 15×15까지 3·3, 큰 판은 칸이 많고 작아서 더 넉넉히(20×20 5·4, 30×30 7·5, 55×55 10·8).
  function rulesOf(n) { return n >= 50 ? { lives: 10, hints: 8 } : n >= 30 ? { lives: 7, hints: 5 } : n >= 20 ? { lives: 5, hints: 4 } : { lives: 3, hints: 3 }; }
  const TRIADS = ['ROY', 'BTG', 'VPR', 'GYO', 'NBI', 'POY', 'TBV'];
  const WD = ['일', '월', '화', '수', '목', '금', '토'];
  // 난이도마다 지도의 한 구간이에요. 아래(사과 마을)에서 위(버섯 숲)로 올라가요.
  const ZONE = {
    easy: { no: 1, name: '사과 마을', house: 'house-apple', q: '처음이에요', sub: '5×5 · 규칙부터 차근차근', a: '좋아, 사과 마을부터<br>같이 가자냥!',
      decor: { big: ['house-apple', 'house-apple'], mid: ['tree-apple', 'tree-round', 'bush', 'tree-apple'], small: ['flowers', 'fence', 'rocks', 'flowers', 'bush'] } },
    normal: { no: 2, name: '당근 밭', house: 'house-carrot', q: '조금 해 봤어요', sub: '10×10 · 가장 인기 있는 크기', a: '오, 그럼 당근 밭으로<br>가자냥!',
      decor: { big: ['house-carrot', 'house-carrot'], mid: ['tree-round', 'sunflower', 'tree-apple', 'sunflower', 'bush'], small: ['pumpkin', 'flowers', 'fence', 'rocks', 'pumpkin'] }, tint: ['#E6D244', 0.2] },
    hard: { no: 3, name: '버섯 숲', house: 'house-mushroom', q: '자신 있어요', sub: '15×15 · 큰 그림에 도전', a: '멋지다냥! 버섯 숲으로<br>바로 가자냥!',
      decor: { big: ['house-mushroom', 'house-mushroom'], mid: ['tree-pine', 'tree-pine', 'tree-round', 'tree-pine'], small: ['mushrooms', 'rocks', 'bush', 'mushrooms', 'flowers'] }, tint: ['#5FA638', 0.2] },
    // 4~6구간: 큰 판. 처음 난이도 고르기에는 안 나오고, 구간 바꾸기·지도로 들어가요.
    pro: { no: 4, name: '수박 마을', house: 'house-watermelon',
      decor: { big: ['house-watermelon', 'house-watermelon'], mid: ['tree-round', 'bush', 'sunflower', 'tree-apple'], small: ['flowers', 'fence', 'rocks', 'flowers', 'bush'] }, tint: ['#F07A8A', 0.14] },
    expert: { no: 5, name: '호박 언덕', house: 'house-pumpkin',
      decor: { big: ['house-pumpkin', 'house-pumpkin'], mid: ['sunflower', 'tree-round', 'tree-pine', 'sunflower'], small: ['pumpkin', 'pumpkin', 'rocks', 'flowers', 'fence'] }, tint: ['#F2A03C', 0.2] },
    master: { no: 6, name: '별빛 성', house: 'house-castle',
      decor: { big: ['house-castle', 'house-castle'], mid: ['tree-pine', 'tree-round', 'tree-pine', 'bush'], small: ['rocks', 'flowers', 'mushrooms', 'fence', 'rocks'] }, tint: ['#8C7BD8', 0.22] },
  };
  const DSIZE = { 'house-apple': 150, 'house-carrot': 104, 'house-mushroom': 138, 'house-watermelon': 140, 'house-pumpkin': 140, 'house-castle': 150, 'tree-apple': 112, 'tree-round': 106, 'tree-pine': 92,
    bush: 70, flowers: 52, fence: 74, sunflower: 50, rocks: 60, mushrooms: 52, pumpkin: 56 };
  const $ = (id) => document.getElementById(id);
  const IMG = (n) => `assets/${n}.webp`;
  // 새로고침해도 브라우저가 예전 스크롤 자리를 덮어쓰지 않게(지도는 늘 콕이 자리로 스크롤해요)
  try { history.scrollRestoration = 'manual'; } catch (e) {}
  ['cat-idle', 'cat-happy', 'cat-oops', 'cat-sad', 'heart', 'star', 'node-stump', 'node-stone'].forEach((n) => { new Image().src = IMG(n); });
  function cat(mood) { return `<img class="catimg" src="${IMG('cat-' + (mood || 'idle'))}" alt="">`; }
  const BACK = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path class="bo" d="M15 5l-7 7 7 7" stroke="#8A4E10" stroke-width="7"/><path d="M15 5l-7 7 7 7" stroke="#fff" stroke-width="3.4"/></svg>';

  /* ---------- 저장 ---------- */
  let store = { done: {}, cur: {}, rand: {}, seenHelp: false };
  try { Object.assign(store, JSON.parse(localStorage.getItem(KEY)) || {}); } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

  /* ---------- 퍼즐 찾기 ---------- */
  function ymd(d) { return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }
  function dayOffset(k) { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() - k); return d; }
  function dateOf(n) { return new Date(Math.floor(n / 10000), Math.floor(n / 100) % 100 - 1, n % 100, 12); }

  // 만들어진 무늬는 가운데에서 바깥으로 세 가지 색을 입혀요.
  function ringColors(grid, seed) {
    const n = grid.length, tri = TRIADS[Math.abs(seed) % TRIADS.length], mid = (n - 1) / 2;
    return grid.flatMap((row, r) => row.map((v, c) => {
      if (!v) return null;
      const d = Math.max(Math.abs(r - mid), Math.abs(c - mid)) / (mid + 0.5);
      return PAL[tri[Math.min(2, Math.floor(d * 3))]];
    }));
  }
  function packOf(lv) { return PACKS.find((p) => p.id === lv); }
  function countDone(pack) { return pack.puzzles.filter((z) => store.done[`p-${pack.id}-${z.k}`]).length; }
  // 구간마다 아직 안 푼 첫 단계가 지금 풀 수 있는 단계예요. 그 뒤는 잠겨 있어요.
  function nextIn(lv) {
    const z = packOf(lv).puzzles.find((q) => !store.done[`p-${lv}-${q.k}`]);
    return z ? `p-${lv}-${z.k}` : null;
  }
  function stateOf(id) {
    if (store.done[id]) return 'done';
    return nextIn(id.split('-')[1]) === id ? 'open' : 'lock';
  }
  function nextStage(fromPack) {
    const pi = PACKS.findIndex((p) => p.id === fromPack);
    for (let q = pi; q < PACKS.length; q++) { const nx = nextIn(PACKS[q].id); if (nx) return nx; }
    return null;
  }

  function getPuzzle(id) {
    const [kind, a, b] = id.split('-');
    if (kind === 'p') {
      const pack = packOf(a), i = pack.puzzles.findIndex((q) => q.k === +b), z = pack.puzzles[i];
      return { id, pack, i, name: z.name, label: `${pack.name} ${i + 1}단계`, size: pack.size, grid: parse(z.rows), colors: colorsOf(z.rows), next: null, nextLabel: '다음 단계' };
    }
    if (kind === 'daily') {
      const n = +a, d = dateOf(n), grid = generate(10, n);
      return { id, name: `${d.getMonth() + 1}월 ${d.getDate()}일`, label: `${d.getMonth() + 1}월 ${d.getDate()}일`, size: 10, grid, colors: ringColors(grid, n), next: null };
    }
    const size = +a, grid = generate(size, +b);
    return { id, name: `랜덤 ${size}×${size}`, label: `랜덤 ${size}×${size}`, size, grid, colors: ringColors(grid, +b), next: 'rand:' + size, nextLabel: '새 랜덤 퍼즐' };
  }
  function newRandom(size) {
    const id = `rand-${size}-${(Date.now() % 2147483647) | 0}`;
    store.rand[size] = id; save();
    return id;
  }

  function thumb(n, colors) {
    let s = `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" aria-hidden="true">`;
    colors.forEach((col, i) => { if (col) s += `<rect x="${i % n}" y="${Math.floor(i / n)}" width="1.03" height="1.03" fill="${col}"/>`; });
    return s + '</svg>';
  }
  function starsHtml(n) { return [0, 1, 2].map((i) => `<img class="${i < n ? '' : 'off'}" src="${IMG('star')}" alt="">`).join(''); }
  function fmt(t) { return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }
  function show(screen) {
    for (const s of ['onb', 'map', 'gal', 'game']) $(s).hidden = s !== screen;
    if (screen !== 'map') closePop();
  }
  function toast(text) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = text;
    document.body.appendChild(t); setTimeout(() => t.remove(), 2100);
  }

  /* ---------- 난이도 고르기 (처음 한 번) ---------- */
  function standHtml(mood) {
    return `<div class="stand"><span class="glow"></span><img class="stump" src="${IMG('node-stump')}" alt=""><img class="c" src="${IMG('cat-' + (mood || 'idle'))}" alt=""></div>`;
  }
  function renderOnb(lv) {
    show('onb');
    $('onb').innerHTML = lv
      ? `<div class="say">${ZONE[lv].a}</div>${standHtml('happy')}
         <div class="onb-go"><button class="pb" data-act="start" data-lv="${lv}">콕콕 시작!</button><button class="btn-txt" data-act="back">다시 고를래요</button></div>`
      : `<div class="say">안녕! 나는 콕이야.<br>노노그램은 얼마나 해 봤냥?</div>${standHtml()}
         <div class="choices">${PACKS.slice(0, 3).map((p) => { const Z = ZONE[p.id]; return `<button class="choice" data-level="${p.id}"><img src="${IMG(Z.house)}" alt=""><span><b>${Z.q}</b><small>${Z.sub}</small></span><em>${Z.no}구간<br>${Z.name}</em></button>`; }).join('')}</div>`;
    window.scrollTo(0, 0);
  }

  /* ---------- 지도 그리기 ---------- */
  function rng(a) { return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  let LAY = null;
  function layout() {
    const W = Math.min(window.innerWidth, 480);
    if (LAY && LAY.W === W) return LAY;
    const U = W - 76, cx = Math.round(U / 2 + 6), A = Math.round(U * 0.32);
    const DY = 126, GAP = 250, BOT = 250, TOP = 330;
    const nodes = [], rivers = [];
    let d = BOT, g = 0;
    PACKS.forEach((pack, s) => {
      if (s) { const prev = d - DY; rivers.push({ d: prev + (DY + GAP) / 2, pack }); d = prev + DY + GAP; }
      pack.puzzles.forEach((z, i) => {
        nodes.push({ pack, i, z, id: `p-${pack.id}-${z.k}`, x: Math.round(cx + A * Math.sin(g * Math.PI / 4)), d });   // 레퍼런스처럼 꺾이는 곳마다 단계가 하나씩 놓여요
        d += DY; g++;
      });
    });
    const H = d - DY + TOP;
    nodes.forEach((n) => { n.y = H - n.d; });
    rivers.forEach((r) => { r.y = H - r.d; });
    // 길: 맨 아래에서 시작해 단계마다 지나가고, 강은 가운데 다리로 건너요.
    const pts = [[cx, H + 30], [cx, H - 110]];
    nodes.forEach((n) => {
      const r = n.i === 0 && rivers.find((rv) => rv.pack === n.pack);
      if (r) pts.push([cx, r.y + 64], [cx, r.y - 64]);
      pts.push([n.x, n.y]);
    });
    const last = nodes[nodes.length - 1], chest = { x: cx, y: last.y - 150 };
    pts.push([cx, chest.y + 4]);
    let pd = `M${pts[0][0]},${pts[0][1]}`;
    const samples = [];
    const bez = (a, b, c, e, t) => { const u = 1 - t; return [u * u * u * a[0] + 3 * u * u * t * b[0] + 3 * u * t * t * c[0] + t * t * t * e[0], u * u * u * a[1] + 3 * u * u * t * b[1] + 3 * u * t * t * c[1] + t * t * t * e[1]]; };
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      pd += `C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0]},${p2[1]}`;
      for (let t = 0; t < 1; t += 1 / 14) samples.push(bez(p1, c1, c2, p2, t));
    }
    // 구간 표지판: 1구간은 출발점 옆, 나머지는 다리 건너편 둑에 세워요.
    const signs = [{ pack: PACKS[0], x: Math.max(70, cx - 112), y: H - 36 }].concat(rivers.map((r) => ({ pack: r.pack, x: Math.max(70, cx - 112), y: r.y - 40 })));
    // 소품: 길·발판·강·표지판을 피해서 구간마다 정해진 순서로 흩어 놓아요(매번 같은 자리).
    const rnd = rng(20261125), deco = [], obst = [];
    nodes.forEach((n) => obst.push({ x: n.x, y: n.y - 10, r: 48 }));
    signs.forEach((s) => obst.push({ x: s.x, y: s.y - 50, r: 66 }));
    obst.push({ x: chest.x, y: chest.y - 30, r: 60 });
    const free = (x, cy, r) => {
      for (const p of samples) if (Math.hypot(p[0] - x, p[1] - cy) < r + 24) return false;
      for (const o of obst) if (Math.hypot(o.x - x, o.y - cy) < r + o.r - 8) return false;
      for (const rv of rivers) if (Math.abs(rv.y - cy) < r + 46) return false;
      return true;
    };
    const blobs = [];
    PACKS.forEach((pack, s) => {
      const y1 = s ? rivers[s - 1].y : H + 20, y0 = s < rivers.length ? rivers[s].y : 0, h = y1 - y0, Z = ZONE[pack.id].decor;
      for (let k = 0; k < Math.round(h / 260); k++) blobs.push({ x: rnd() * W, y: y0 + rnd() * h, rx: 90 + rnd() * 90, ry: 50 + rnd() * 40 });
      const list = [];
      for (let k = 0; k < Math.max(2, Math.round(h / 560)); k++) list.push(Z.big[k % Z.big.length]);
      for (let k = 0; k < Math.round(h / 118); k++) list.push(Z.mid[k % Z.mid.length]);
      for (let k = 0; k < Math.round(h / 62); k++) list.push(Z.small[k % Z.small.length]);
      list.forEach((name) => {
        const w = Math.round(DSIZE[name] * (0.9 + rnd() * 0.2)), r = w * 0.4;
        for (let t = 0; t < 80; t++) {
          const x = -w * 0.15 + rnd() * (W + w * 0.25), y = y0 + 40 + rnd() * (h - 50), cy = y - w * 0.42;
          if (free(x, cy, r)) { deco.push({ name, x: Math.round(x), y: Math.round(y), w, flip: rnd() < 0.4 }); obst.push({ x, y: cy, r }); break; }
        }
      });
    });
    LAY = { W, H, cx, nodes, rivers, pd, signs, chest, deco, blobs };
    return LAY;
  }

  function riverD(y, W) {
    let s = '';
    for (let x = -20; x <= W + 20; x += 10) s += (s ? 'L' : 'M') + x + ',' + (y - 30 + 6 * Math.sin(x / 38)).toFixed(1);
    for (let x = W + 20; x >= -20; x -= 10) s += 'L' + x + ',' + (y + 30 + 6 * Math.sin(x / 38 + 1.4)).toFixed(1);
    return s + 'Z';
  }
  function groundSvg(L) {
    const { W, H } = L;
    let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">`;

    L.rivers.forEach((rv, k) => {

    });

  let heroFrom = null;   // 방금 처음 푼 단계: 지도로 돌아오면 콕이가 거기서 다음 단계로 걸어가요

  function renderHud() {

  /* ---------- 구간 바꾸기 ---------- */

  /* ---------- 모은 그림 ---------- */
  // 모든 난이도를 순서대로 한 번에 쭉 내려 봐요. 위쪽 작은 탭은 그 난이도로 이동(앵커)하는 버튼이에요.
  let galTab = null, galLock = 0;

  /* ---------- 게임 ---------- */
  let G = null, els = [], rcEls = [], ccEls = [], hl = null, drag = null, timer = null, sayT = null, edgeC = null;

  // 콕이가 말풍선으로 한마디 해요. hold가 없으면 잠시 뒤 평소 표정으로 돌아와요.

  function startGame(id, fresh, from) {
    const p = getPuzzle(id), n = p.size;

    if (p.pack && from !== 'gal' && stateOf(id) === 'open' && store.level !== p.pack.id) { store.level = p.pack.id; save(); }
    heroFrom = null;
    G = {
      p, n, from: from || 'map', sol: p.grid.flat(), clues: allClues(p.grid),
      cells: s ? s.cells.slice() : new Array(n * n).fill(0),
      lives: s ? s.lives : rulesOf(n).lives, hints: s ? s.hints : rulesOf(n).hints, maxLives: rulesOf(n).lives,

    $('gtitle').textContent = p.label;
    buildBoard();
    say(s ? '이어서 풀자냥!' : G.overview ? '전체 판이다냥. 풀 곳을 콕 누르면 크게 보여요' : coarse && aimOn() ? '손가락 위 동그라미로 칸을 맞추고 떼면 칠한다냥' : G.canZoom ? '끌어서 칠하고, 두 손가락을 벌리면 커진다냥' : `${n}×${n} 퍼즐이다냥. 콕콕!`);

    for (let i = 0; i < n; i++) { markClues('r', i); markClues('c', i); }
    setMode('fill'); renderStatus();

  // 맞춤 칸 크기: 판 전체가 한 화면에 들어오는 크기. 큰 판(20×20 이상)을 다 풀면 숫자 띠를 접고 그림만 크게 보여요.

  // 칸 크기만 바꿔요(칸을 다시 만들지 않아서 55×55도 가볍게 확대·축소돼요). G.zc: 확대 칸 크기, 0이면 맞춤.

    });
  }
  // 손가락은 판 둘레 여백까지 포함한 판 영역 전체에서 받아요. 판 칸 위 한 손가락 = 칠하기,
  // 숫자 띠·여백 위 한 손가락 = 판 옮기기(확대 중), 어디든 두 손가락 = 옮기기·벌려 확대·오므려 전체 보기.
  const boardWrap = document.querySelector('#game .wrap'), stageEl = $('stage');
  let pan1 = null, ovTap = null;
  function zoomAt(at) {
    const fr = gridFrac(at); fr.fx = Math.max(0, Math.min(1, fr.fx)); fr.fy = Math.max(0, Math.min(1, fr.fy));
    setCell(Math.max(store.zc || 0, ZC()), fr, at);
  }
  stageEl.addEventListener('pointerdown', (e) => {
    if (!G || G.won || G.over || (e.button && e.button !== 0)) return;
    stopFling();
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { stageEl.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
    if (pts.size >= 2) {
      pan1 = null; ovTap = null;
      if (aim) aimEnd(false);
      if (pend) { clearTimeout(pend.t); pend = null; highlight(null); }
      if (drag) { drag = null; highlight(null); }
      undoTouch();
      if (pts.size === 2) startPan();
      return;
    }
    if (G.overview) { ovTap = { id: e.pointerId, x: e.clientX, y: e.clientY }; return; }
    const touch = e.pointerType !== 'mouse';
    if (touch && aimOn()) { touchSnap = null; aimStart(e); return; }
    const pos = grid.contains(e.target) ? cellAt(e) : null;
    touchSnap = null;
    if (!pos) { if (zoomed()) pan1 = panStart(e.clientX, e.clientY); return; }
    if (touch && zoomed()) { pend = { pos, id: e.pointerId, x: e.clientX, y: e.clientY, hold: true, t: setTimeout(() => commit(true), HOLD) }; return; }
    if (touch && G.canZoom) { pend = { pos, id: e.pointerId, x: e.clientX, y: e.clientY, t: setTimeout(commit, 110) }; highlight(pos); return; }
    begin(pos);
  });
  stageEl.addEventListener('pointermove', (e) => {
    if (!G) return;
    if (pts.has(e.pointerId)) pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pan) { if (pts.size >= 2) movePan(); return; }
    if (ovTap && e.pointerId === ovTap.id && Math.hypot(e.clientX - ovTap.x, e.clientY - ovTap.y) > 10) ovTap = null;
    if (pan1) { panMove(e); return; }
    if (aim) { if (e.pointerId === aim.id) aimMove(e.clientX, e.clientY); return; }
    if (pend && e.pointerId === pend.id && Math.hypot(e.clientX - pend.x, e.clientY - pend.y) > (pend.hold ? SLOP : 6)) {
      // 확대 중 꾹 누르기 전에 움직이면 칠하지 않고 판을 옮겨요(손가락이 처음 닿은 곳부터 이어서).
      if (pend.hold) { const p = pend; clearTimeout(p.t); pend = null; pan1 = panStart(p.x, p.y); panMove(e); return; }
      commit();
    }
    if (!drag) { if (e.pointerType === 'mouse' && canHover) highlight(cellAt(e)); return; }   // 휴대폰이 탭 뒤에 흉내 내는 마우스 움직임으로 줄이 켜진 채 남지 않게
    if (!drag.alive || G.won || G.over) return;
    lastPt = { clientX: e.clientX, clientY: e.clientY };
    extendDrag(lastPt);
    if (zoomed()) edgeScroll();
  });
  function endDrag(e) {
    pts.delete(e.pointerId);
    if (aim && e.pointerId === aim.id) { aimEnd(e.type === 'pointerup'); return; }
    if (ovTap && e.pointerId === ovTap.id) { const t = ovTap; ovTap = null; if (e.type === 'pointerup' && G && G.overview && !pan) zoomAt({ x: t.x, y: t.y }); return; }
    if (pan) { if (!pts.size) { if (pan.zooming) { store.zc = zoomed() ? G.zc : 0; save(); } pan = null; } return; }
    if (pan1) { if (!pts.size) panEnd(); return; }
    if (pend && e.pointerId === pend.id) { if (e.type === 'pointerup') commit(); else { clearTimeout(pend.t); pend = null; } }
    lastPt = null;
    if (!drag) { if (e.pointerType !== 'mouse' && !pend) highlight(null); return; }
    drag = null; if (e.pointerType !== 'mouse') highlight(null);
  }
  stageEl.addEventListener('pointerup', endDrag);
  stageEl.addEventListener('pointercancel', endDrag);
  grid.addEventListener('pointerleave', (e) => { if (!drag && e.pointerType === 'mouse') highlight(null); });
  grid.addEventListener('contextmenu', (e) => e.preventDefault());

  /* ---------- 결과 ---------- */
  function openSheet(html) { document.querySelectorAll('.toast').forEach((t) => t.remove()); $('sheet').innerHTML = html; $('overlay').hidden = false; $('overlay').scrollTop = 0; }
  function closeSheet() { $('overlay').hidden = true; $('sheet').innerHTML = ''; }
  function confetti() {
    const cols = ['#FFD23A', '#FF9E3B', '#6CC63A', '#47D1DE', '#FF5184', '#FF5943'];
    let h = '<div class="confetti">';
    for (let i = 0; i < 24; i++) h += `<i style="left:${Math.random() * 100}%;background:${cols[i % cols.length]};animation-duration:${1.6 + Math.random() * 1.6}s;animation-delay:${Math.random() * 0.5}s"></i>`;
    return h + '</div>';
  }

  function win(lastCell) {
    G.won = true;
    const id = G.p.id, stars = G.miss === 0 ? 3 : G.miss <= Math.max(1, Math.floor(G.maxLives / 3)) ? 2 : 1, prev = store.done[id];
    store.done[id] = { stars: Math.max(stars, prev ? prev.stars : 0), time: prev ? Math.min(prev.time, G.time) : G.time };
    delete store.cur[id];
    if (store.rand[G.n] === id) delete store.rand[G.n];
    save();
    const p = G.p, time = G.time, miss = G.miss, from = G.from;
    let title = '그림 완성!', sub = miss === 0 ? '한 번도 안 틀렸어요. 최고예요!' : '숨어 있던 그림을 찾았어요';
    if (p.pack) {
      if (!prev && from === 'map') heroFrom = id;
      p.next = from === 'gal' ? null : nextStage(p.pack.id);
      if (!prev && !nextIn(p.pack.id)) {
        const Z = ZONE[p.pack.id], up = PACKS[PACKS.indexOf(p.pack) + 1];
        title = `${Z.name} 완성!`;
        sub = up ? `다음은 ${ZONE[up.id].no}구간 ${ZONE[up.id].name}이에요` : '모든 구간을 다 풀었어요!';
      } else if (!prev) sub += ' · 모은 그림에 넣었어요';
    }
    highlight(null); renderStatus();
    say('우와, 그림이 나왔다냥!', 'happy', true);
    // 확대해서 풀었어도 완성 그림은 판 전체로 보여 줘요(큰 판은 숫자 띠를 접고 그림만). 다음 큰 판에서는 다시 확대돼요.
    applySize();
    winFx(lastCell == null ? Math.floor(G.n * G.n / 2) : lastCell);
    setTimeout(() => {
      if (!G || G.p !== p) return;
      openSheet(`${confetti()}
        <div class="masc happy">${cat('happy')}</div>
        <h2>${title}</h2>
        <p>${sub}</p>
        <div class="frame"><div class="pic">${thumb(p.size, p.colors)}</div><span>${p.name}</span></div>
        <div class="bigstars">${starsHtml(stars)}</div>
        <div class="meta"><div><b>${fmt(time)}</b>걸린 시간</div><div><b>${miss}번</b>실수</div></div>
        <div class="btns">
          ${p.next ? `<button class="pb" data-act="next">${p.nextLabel}</button>` : ''}
          <button class="pb ${p.next ? 'cr' : ''}" data-act="home">${from === 'gal' ? '모은 그림으로' : '지도로'}</button>
        </div>`);
    }, 1500);
  }

  function gameOver() {
    if (!G || G.won) return;
    G.over = true; persist(); renderStatus();
    say('힝, 하트가 다 떨어졌다냥', 'sad', true);
    openSheet(`
      <div class="masc">${cat('sad')}</div>
      <h2>하트를 다 썼어요</h2>
      <p>${G.revived ? '괜찮아요, 처음부터 다시 콕콕 해 봐요.' : '하트 하나를 받아서 이어 풀 수 있어요.<br>퍼즐마다 딱 한 번이에요.'}</p>
      <div class="btns">
        ${G.revived ? '' : '<button class="pb green" data-act="revive">하트 1개 받고 이어하기</button>'}
        <button class="pb ${G.revived ? '' : 'cr'}" data-act="restart">처음부터 다시</button>
        <button class="btn-txt" data-act="home">${G.from === 'gal' ? '모은 그림으로' : '지도로'}</button>
      </div>`);
  }

  function showHelp() {
    store.seenHelp = true; save();
    closePop();
    openSheet(`
      <div class="masc">${cat()}</div>
      <h2>이렇게 풀어요</h2>
      <p>숫자를 보고 칸을 채우면 숨은 그림이 나와요.</p>
      <div class="demo"><span>3 1</span><u class="f"></u><u class="f"></u><u class="f"></u><u></u><u class="f"></u></div>
      <ul class="how">
        <li><b>1</b><span>숫자는 그 줄에서 <strong>연달아 채울 칸 수</strong>예요. 숫자가 여럿이면 사이에 빈칸이 한 칸 넘게 있어요.</span></li>
        <li><b>2</b><span>비워야 하는 칸은 <strong>X 표시</strong>를 해 두면 편해요. 줄을 다 채우면 나머지는 저절로 X가 돼요.</span></li>
        <li><b>3</b><span>틀리면 하트가 하나 줄어요. <strong>하트·힌트 3개씩</strong>(큰 판은 더)으로 시작해요. 끌면 한 줄을 쭉 칠해요. 칸이 작은 큰 판은 손가락 위에 <strong>동그라미 조준점</strong>이 떠요. 맞추고 떼면 칠하고, 한 칸에 잠깐 멈췄다 끌면 한 줄을 칠해요. 두 손가락을 벌리면 확대되고, <strong>확대 중엔 끌면 이동, 꾹 누른 채 끌면 칠하기</strong>예요.</span></li>
        <li><b>4</b><span>지도의 단계를 하나씩 풀며 올라가요. 맨 위 버튼으로 <strong>구간(난이도)을 언제든</strong> 바꿀 수 있어요.</span></li>
      </ul>
      <p class="note">${NATIVE ? '기록은 이 폰에만 저장돼요' : '기록은 이 브라우저에만 저장돼요'}</p>
      <div class="btns"><button class="pb" data-act="close">알겠어요!</button></div>`);
  }

  function goBack() {
    persist(); clearInterval(timer); clearTimeout(sayT);
    const from = G ? G.from : 'map', pk = G && G.p.pack ? G.p.pack.id : galTab;
    G = null; closeSheet();
    if (from === 'gal') renderGallery(pk); else renderMap();   // 모은 그림에서 풀었으면 그 그림의 난이도 자리로 돌아가요
  }
  $('back').onclick = goBack;

  /* ---------- 안드로이드 앱: 뒤로 버튼 ---------- */
  // 열린 창 닫기 → 게임에서 나가기 → 모은 그림·다시 고르기에서 한 단계 뒤로 → 지도·처음 화면에서는 2초 안에 한 번 더 누르면 앱을 닫아요.
  let exitAt = 0;
  if (NATIVE && CAP.Plugins && CAP.Plugins.App) {
    const A = CAP.Plugins.App;
    A.addListener('backButton', () => {
      if (!$('overlay').hidden) { if (G && (G.won || G.over)) goBack(); else closeSheet(); return; }
      if ($('pop')) { closePop(); return; }
      if (!$('game').hidden) { goBack(); return; }
      if (!$('gal').hidden) { renderMap(); return; }
      if (!$('onb').hidden && $('onb').querySelector('[data-act="back"]')) { renderOnb(); return; }
      const now = Date.now();
      if (now - exitAt < 2000) { A.exitApp(); return; }
      exitAt = now; toast('한 번 더 누르면 나가요');
    });
    A.addListener('pause', () => persist());
  }

  /* ---------- 누르기 ---------- */
  // 아이폰 사파리는 버튼이 아닌 곳(빈 풀밭, 시트 바깥 어두운 배경)을 손가락으로 눌러도 click 을 만들지 않아요.
  // 화면 뿌리마다 빈 click 리스너를 달아 두면 그 안 어디를 눌러도 click 이 생겨 아래 document 처리로 올라와요.
  ['onb', 'map', 'gal', 'game', 'overlay'].forEach((id) => $(id).addEventListener('click', () => {}));
  // 아이폰 사파리는 viewport 의 user-scalable=no 를 무시해요. 지도·목록 같은 기본 화면에서 화면 확대·끌어 옮기기·복사가 되지 않게 따로 막아요.
  // (판의 두 손가락 확대는 게임이 직접 처리해서 그대로 돼요.)
  ['gesturestart', 'gesturechange', 'gestureend'].forEach((t) => document.addEventListener(t, (e) => e.preventDefault(), { passive: false }));
  ['contextmenu', 'selectstart', 'dragstart'].forEach((t) => document.addEventListener(t, (e) => e.preventDefault()));
  // 두 손가락으로 화면 확대: 판 밖에서는 두 번째 손가락이 닿은 움직임을 막아요.
  document.addEventListener('touchmove', (e) => { if (e.touches.length > 1 && !e.target.closest('#stage')) e.preventDefault(); }, { passive: false });
  // 두 번 톡 눌러 확대: 0.3초 안에 같은 자리를 다시 톡 누르면 그 두 번째 누름의 확대를 막아요(판은 따로 처리).
  let tapEnd = 0, tapX = 0, tapY = 0, tapStart = null;
  document.addEventListener('touchstart', (e) => { tapStart = e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY, t: performance.now() } : null; }, { passive: true });
  document.addEventListener('touchend', (e) => {
    const t = tapStart, c = e.changedTouches[0]; tapStart = null;
    if (!t || !c || e.touches.length || Math.hypot(c.clientX - t.x, c.clientY - t.y) > 10 || performance.now() - t.t > 300) return;
    const now = performance.now(), again = now - tapEnd < 300 && Math.hypot(c.clientX - tapX, c.clientY - tapY) < 40;
    tapEnd = again ? 0 : now; tapX = c.clientX; tapY = c.clientY;
    if (again && e.cancelable && !e.target.closest('#stage')) { e.preventDefault(); const bt = e.target.closest('button'); if (bt && !bt.disabled) bt.click(); }   // 버튼의 두 번째 누름은 그대로 눌러 줘요
  }, { passive: false });
  document.addEventListener('click', (e) => {
    const tg = e.target;
    if (tg.closest('#grid') || tg.closest('.controls') || tg.closest('#back')) return;
    const b = tg.closest('[data-play],[data-rand],[data-setlevel],[data-act],[data-tab],[data-gal],[data-node],[data-level],[data-go],#hero');
    if (!b) {
      if (tg === $('overlay')) { if (!G || (!G.won && !G.over)) closeSheet(); }
      else if (!tg.closest('#pop')) closePop();
      return;
    }
    const ds = b.dataset;
    if (b.id === 'hero') { const k = LAY.nodes.findIndex((n) => n.id === heroTarget()); if (popAt === k) closePop(); else openPop(k); return; }
    if (ds.node) { const k = +ds.node; if (popAt === k) closePop(); else openPop(k); return; }
    if (ds.level) { renderOnb(ds.level); return; }
    if (ds.play) {
      const from = ds.from || (!$('gal').hidden ? 'gal' : G ? G.from : 'map');
      closeSheet(); closePop(); startGame(ds.play, !!ds.fresh, from); return;
    }
    if (ds.rand) { const size = +ds.rand, saved = store.rand[size]; closeSheet(); startGame(saved && store.cur[saved] ? saved : newRandom(size), false, 'map'); return; }
    if (ds.setlevel) { setLevel(ds.setlevel); return; }
    if (ds.tab) { galGo(ds.tab, true); return; }
    if (ds.gal) {
      const st = stateOf(ds.gal);
      if (st === 'done') showGalDetail(ds.gal);
      else if (st === 'open') startGame(ds.gal, false, 'gal');
      else toast('앞 단계를 풀면 열려요');
      return;
    }
    if (ds.go) {
      closePop();
      if (ds.go === 'gallery') renderGallery(store.level);
      else if (ds.go === 'daily') showDaily();
      else if (ds.go === 'random') showRandom();
      else showHelp();
      return;
    }
    const a = ds.act;
    if (a === 'start') {
      store.level = ds.lv;
      if (store.level !== 'easy') store.seenHelp = true;   // 해 본 사람에게는 규칙 설명을 먼저 띄우지 않아요
      save();
      renderMap({ drop: true, pop: true });
    } else if (a === 'back') renderOnb();
    else if (a === 'sections') showSections();
    else if (a === 'close') closeSheet();
    else if (a === 'tomap') renderMap();
    else if (a === 'home') goBack();
    else if (a === 'restart') { closeSheet(); startGame(G.p.id, true, G.from); persist(); }
    else if (a === 'revive') { G.lives = 1; G.revived = true; G.over = false; closeSheet(); renderStatus(); say('다시 힘내자냥!', 'happy'); persist(); }
    else if (a === 'next') {
      const nx = G.p.next, from = G.from; closeSheet();
      startGame(nx.startsWith('rand:') ? newRandom(+nx.slice(5)) : nx, false, from);
    }
  });

  let rsT = null;
  window.addEventListener('resize', () => {
    if (G && !$('game').hidden) relayout();
    else if (!$('map').hidden) {
      clearTimeout(rsT);
      rsT = setTimeout(() => { if (LAY && LAY.W !== Math.min(window.innerWidth, 480)) renderMap(); else updateMe(); }, 150);
    }
  });
  // 콕이 말풍선 줄 수가 바뀌면 판 자리 높이도 바뀌어요. 그때마다 판 크기를 다시 맞춰 판이 말풍선·버튼 쪽으로 넘치지 않게 해요(확대 중이면 보던 자리 유지).
  if (window.ResizeObserver) {
    let stH = 0, stW = 0;
    new ResizeObserver(() => {
      const st = $('stage');
      if (!G || $('game').hidden || (st.clientHeight === stH && st.clientWidth === stW)) return;
      stH = st.clientHeight; stW = st.clientWidth;
      const w = $('board').parentElement, r = w.getBoundingClientRect(), f = zoomed() ? gridFrac({ x: r.left + w.clientWidth / 2, y: r.top + w.clientHeight / 2 }) : null;
      applySize(); if (f) keepFocus(f);
    }).observe($('stage'));
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden) persist(); });
  window.addEventListener('pagehide', persist);

  // 처음 온 사람은 난이도부터 골라요. 이미 풀던 기록이 있으면 쉬움 구간으로 두고 지도에서 바꿀 수 있어요.
  // 쉬는 구간(55×55)에 있던 사람은 열린 마지막 구간으로, 쉬는 구간의 이어 풀기 기록은 숨겨 둬요(지우지는 않아요).
  if (store.level && !packOf(store.level)) { store.level = PACKS[PACKS.length - 1].id; save(); }
  if (!store.level && (Object.keys(store.done).length || Object.keys(store.cur).length)) { store.level = 'easy'; save(); }
  if (store.level) renderMap(); else renderOnb();
})();
</script>
</body>
</html>
